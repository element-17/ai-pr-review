server:
  port: 8080

spring:
  application:
    name: ai-pr-review-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${pr.datasource.host}:${pr.datasource.port}/${pr.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: ${pr.datasource.driver-class-name}
    username: ${pr.datasource.username}
    password: ${pr.datasource.password}
  data:
    redis:
      host: ${pr.redis.host}
      port: ${pr.redis.port}
      password: ${pr.redis.password}
      database: ${pr.redis.database}
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # 数据库初始化脚本放在 db/schema.sql，由开发者手动执行；避免每次启动重复建表
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.asuka.backend.entity
  configuration:
    # 数据库下划线字段自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键自增，实体使用 @TableId(type = IdType.AUTO)
      id-type: auto
      # 逻辑删除：查询自动追加 deleted = 0，删除自动改写为 deleted = 1
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  # 前端通过 Authorization: Bearer <accessToken> 传递访问令牌
  token-name: Authorization
  token-prefix: Bearer
  # access-token 有效期（秒），refresh-token 由 Redis 单独管理
  timeout: 1800
  active-timeout: -1
  # 允许同一账号多端登录；如需单端登录改为 false
  is-concurrent: true
  is-share: false
  is-read-header: true
  is-read-cookie: false
  is-log: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.asuka.backend.mapper: debug
    com.asuka.backend.service: info
    com.asuka.backend.controller: info
