<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-labelledby="loading-title">
  <title id="loading-title">加载中</title>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: no-preference) {
      .spinner { transform-origin: 12px 12px; animation: spin .8s linear infinite; }
    }
  </style>
  <circle cx="12" cy="12" r="9" stroke="#6366f1" stroke-opacity=".16" stroke-width="2.5"/>
  <path class="spinner" d="M12 3a9 9 0 0 1 9 9" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
</svg>
